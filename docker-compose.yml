version: "3.9"

services:
  server:
    build:
      context: .
      dockerfile: packages/server/Dockerfile
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      DATABASE_URL: sqlite:./data/convergd.sqlite
      AI_PROVIDER: hf
      AI_ENABLED: "false"
      LOG_LEVEL: info
    volumes:
      - .:/app
      - sqlite_data:/app/data
    restart: unless-stopped

  ai:
    build:
      context: .
      dockerfile: packages/ai/Dockerfile
    ports:
      - "4000:4000"
    environment:
      PORT: 4000
      AI_PROVIDER: hf
      AI_ENABLED: "false"
    restart: unless-stopped

volumes:
  sqlite_data:
